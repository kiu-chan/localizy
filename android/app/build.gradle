plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Load key.properties for signing
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Load . env file
def envFile = rootProject.file("../../.env")
def envProperties = new Properties()
if (envFile.exists()) {
    envFile.withInputStream { envProperties.load(it) }
}

android {
    namespace = "com.cameroon.citea"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.cameroon.citea"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        def secretsPropertiesFile = rootProject.file("secrets.properties")
        def secretsProperties = new Properties()
        if (secretsPropertiesFile.exists()) {
            secretsPropertiesFile.withReader('UTF-8') { reader ->
                secretsProperties.load(reader)
            }
        }
        
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY_ANDROID: secretsProperties['GOOGLE_MAPS_API_KEY_ANDROID'] ?: ""
        ]
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        def variantName = variant.name.capitalize()
        def date = new Date().format("yyyyMMdd")
        def baseName = "citea_v${variant.versionName}+${variant.versionCode}_${date}"

        def assembleTask = tasks.findByName("assemble${variantName}")
        assembleTask?.doLast {
            def apkDir = file("${buildDir}/outputs/flutter-apk")
            apkDir.listFiles()?.each { f ->
                if (f.name.endsWith(".apk") && !f.name.startsWith("citea_")) {
                    project.copy { from f; into apkDir; rename { "${baseName}.apk" } }
                }
            }
        }

        def bundleTask = tasks.findByName("bundle${variantName}")
        bundleTask?.doLast {
            def aabDir = file("${buildDir}/outputs/bundle/${variant.name}")
            aabDir.listFiles()?.each { f ->
                if (f.name.endsWith(".aab") && !f.name.startsWith("citea_")) {
                    project.copy { from f; into aabDir; rename { "${baseName}.aab" } }
                }
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:review:2.0.1'
}
